<head>
<meta charset="utf-8">

<title>마이사 정책 안내</title>
<style>
  :root {
    --bg: #faf7f0; --fg: #1c1a16; --muted: #5d574c;
    --line: #e2dccd; --accent: #8a6a1f; --card: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14120e; --fg: #f0ece2; --muted: #a8a194;
      --line: #322d24; --accent: #d8b45c; --card: #1c1913;
    }
  }
  :root[data-theme="dark"] {
    --bg: #14120e; --fg: #f0ece2; --muted: #a8a194;
    --line: #322d24; --accent: #d8b45c; --card: #1c1913;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo",
                 "Malgun Gothic", "Noto Sans KR", sans-serif;
    line-height: 1.7; font-size: 16px;
  }
  .wrap { max-width: 640px; margin: 0 auto; padding: 72px 16px 96px; }
  h1 { font-size: 32px; margin: 0 0 6px; letter-spacing: -0.02em; }
  .sub { color: var(--muted); margin: 0 0 40px; }
  a.card {
    display: block; text-decoration: none; color: inherit;
    background: var(--card); border: 1px solid var(--line);
    border-radius: 12px; padding: 20px 22px; margin-bottom: 14px;
  }
  a.card strong { display: block; font-size: 18px; color: var(--accent); margin-bottom: 4px; }
  a.card span { color: var(--muted); font-size: 15px; }
  footer { margin-top: 48px; color: var(--muted); font-size: 14px; }
  footer a { color: var(--accent); }
</style>
</head>
